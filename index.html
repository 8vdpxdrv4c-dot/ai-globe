function slerpCam(f,t){const a=f.from.length(),b=f.to.length();const da=f.from.clone().normalize(),db=f.to.clone().normalize();
 const ang=da.angleTo(db);let dir;if(ang<1e-4)dir=db;else{const s=Math.sin(ang);dir=da.multiplyScalar(Math.sin((1-t)*ang)/s).add(db.multiplyScalar(Math.sin(t*ang)/s));}
 const lift=Math.sin(Math.PI*t)*Math.min(ang*.8,1.2);return dir.normalize().multiplyScalar(a+(b-a)*t+lift);}

const lblRoot=document.getElementById('lbl'),svg=document.getElementById('lsvg');const NS='http://www.w3.org/2000/svg';
const groups=[];{const m=new Map();markers.forEach(o=>{if(!m.has(o.city))m.set(o.city,[]);m.get(o.city).push(o);});
 m.forEach((ms,city)=>{const n=new THREE.Vector3();ms.forEach(o=>n.add(o.pos));n.normalize();
  const el=document.createElement('div');el.className='cl';lblRoot.appendChild(el);

  const dot=document.createElementNS(NS,'circle');dot.setAttribute('r','2.6');svg.appendChild(dot);
  const g={city,ms,n,pos:n.clone().multiplyScalar(R*1.002),el,line,dot,x:0,y:0,w:0,h:0,init:false,op:0,vis:[]};
  el.addEventListener('click',e=>{const t=e.target.closest('[data-id]');select(t?byId[t.dataset.id]:g.vis[0]);});

const hex=c=>'#'+c.getHexString();
function buildCards(){groups.forEach(g=>{g.vis=g.ms.filter(visible);if(!g.vis.length)return;
 const cnt={};g.vis.forEach(o=>cnt[o.layer]=(cnt[o.layer]||0)+1);const dom=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];
 const col=g.vis[0].cty==='CN'?hex(COL.CN):hex(COL[dom]);g.col=col;
 g.el.style.borderColor=col+'88';g.el.style.borderLeftColor=col;g.line.setAttribute('stroke',col);g.dot.setAttribute('fill',col);
 if(g.vis.length===1){const o=g.vis[0];g.el.innerHTML=`<b>${o.cn}</b> <span class="c">${o.city}</span><div class="r">${o.role}</div>`;}
 else g.el.innerHTML=`<b>${g.city.split(' ').pop()}</b> <span class="c">${g.vis.length} 家</span><div>${g.vis.map(o=>`<span class="n" data-id="${o.id}" style="color:${hex(o.color)}">${o.cn}</span>`).join('<span style="opacity:.4">、</span>')}</div>`;
 g.el.style.transform='none';g.el.style.display='block';g.el.style.visibility='hidden';g.w=g.el.offsetWidth;g.h=g.el.offsetHeight;g.el.style.visibility='';g.el.style.display='none';g.init=false;});}
const _applyFilter=applyFilter;applyFilter=function(){_applyFilter();buildCards();};
const tmp=new THREE.Vector3(),camDir=new THREE.Vector3();
function updateCards(){const W=innerWidth,H=innerHeight;const cd=camera.position.length();camDir.copy(camera.position).normalize();
 const sc=THREE.MathUtils.clamp(2.3/cd,.72,1);
 tmp.set(0,0,0).project(camera);const cx=(tmp.x+1)/2*W,cy=(1-tmp.y)/2*H;
 // horizon: point visible if dot(n,camPos) > R
 const act=[];const shown=started&&introT>=1;
 groups.forEach(g=>{const f=g.n.dot(camera.position)/R;const face=(f-1)/(cd-1);g.face=face; // 1 at center
  if(!shown||!g.vis.length||face<.06){g.act=false;return;}
  tmp.copy(g.pos).project(camera);g.dx=(tmp.x+1)/2*W;g.dy=(1-tmp.y)/2*H;if(g.dx<(W>1100?250:0)||g.dx>(W>1100?W-310:W)||g.dy<0||g.dy>H){g.act=false;return;}
  let ox=g.dx-cx,oy=g.dy-cy;const l=Math.hypot(ox,oy)||1;ox/=l;oy/=l;if(l<4){ox=.6;oy=-.8;}
  const L=28+22*sc,w=g.w*sc,h=g.h*sc;g.sw=w;g.sh=h;
  g.tx=g.dx+ox*(L+w/2*Math.abs(ox))-0;g.ty=g.dy+oy*(L+h/2*Math.abs(oy));
  if(!g.init){g.x=g.tx;g.y=g.ty;g.init=true;}g.act=true;act.push(g);});
 act.sort((a,b)=>b.vis.length-a.vis.length||b.face-a.face);
 for(let it=0;it<6;it++){
  act.forEach(g=>{g.x+=(g.tx-g.x)*.12;g.y+=(g.ty-g.y)*.12;});
  for(let i=0;i<act.length;i++)for(let j=i+1;j<act.length;j++){const a=act[i],b=act[j];
   const ox=(a.sw+b.sw)/2+6-Math.abs(a.x-b.x),oy=(a.sh+b.sh)/2+5-Math.abs(a.y-b.y);
   if(ox>0&&oy>0){if(ox<oy){const s=(a.x<b.x?-1:1)*ox/2;a.x+=s*.35;b.x-=s*.65;}else{const s=(a.y<b.y?-1:1)*oy/2;a.y+=s*.35;b.y-=s*.65;}}}
  const xl=W>1100?285:6,xr=W>1100?W-335:W-6;act.forEach(g=>{g.x=THREE.MathUtils.clamp(g.x,g.sw/2+xl,xr-g.sw/2);g.y=THREE.MathUtils.clamp(g.y,g.sh/2+6,H-g.sh/2-6);});}
 // greedy declutter: drop cards still overlapping a higher-priority one, or with very long leaders
 const placed=[];act.forEach(g=>{let ok=Math.hypot(g.x-g.dx,g.y-g.dy)<260*sc+g.sw/2;
  if(ok)for(const p of placed){const ox=(p.sw+g.sw)/2-Math.abs(p.x-g.x),oy=(p.sh+g.sh)/2-Math.abs(p.y-g.y);if(ox>2&&oy>2){ok=false;break;}}
  g.keep=ok;if(ok)placed.push(g);});
 groups.forEach(g=>{const tgt=g.act&&g.keep?THREE.MathUtils.smoothstep(g.face,.06,.3):0;g.op+=(tgt-g.op)*.18;
  const vis=g.op>.02;g.el.style.display=vis?'block':'none';g.line.style.display=g.dot.style.display=vis?'':'none';
  if(g.act)g.dot.setAttribute('cx',g.dx),g.dot.setAttribute('cy',g.dy),g.dot.style.display=g.act?'':'none',g.dot.style.opacity=Math.min(1,g.face*4);
  if(!vis)return;
  g.el.style.opacity=g.op;g.el.style.transform=`translate(${g.x-g.sw/2}px,${g.y-g.sh/2}px) scale(${sc})`;g.el.style.transformOrigin='0 0';
  // leader: from dot to nearest card edge point
  const ex=THREE.MathUtils.clamp(g.dx,g.x-g.sw/2,g.x+g.sw/2),ey=THREE.MathUtils.clamp(g.dy,g.y-g.sh/2,g.y+g.sh/2);
  const mx=(g.dx+ex)/2;g.line.setAttribute('d',`M${g.dx.toFixed(1)},${g.dy.toFixed(1)} L${(Math.abs(ex-g.dx)>Math.abs(ey-g.dy)?mx:g.dx).toFixed(1)},${ey.toFixed(1)} L${ex.toFixed(1)},${ey.toFixed(1)}`);
  g.line.style.opacity=g.op*.8;});}

function tick(){const dt=Math.min(clock.getDelta(),.05);const t=clock.elapsedTime;earthU.uTime.value=t;
 if(started&&introT<1){introT=Math.min(1,introT+dt/3.5);const e=ease(introT);const p=introFrom.clone().lerp(introTo,e);
  p.applyAxisAngle(new THREE.Vector3(0,1,0),(1-e)*2.2);camera.position.copy(p);if(introT>=1){controls.autoRotate=true;}}
 if(fly){fly.t+=dt/fly.dur;const e=ease(Math.min(fly.t,1));camera.position.copy(slerpCam(fly,e));if(fly.t>=1)fly=null;}
 clouds.rotation.y+=dt*.006;
 {const cp=camera.position.clone().normalize();sunDir.copy(cp.applyAxisAngle(new THREE.Vector3(0,1,0),.95+.25*Math.sin(t*.05))).setY(cp.y*.5+.2).normalize();}
 const cd=camera.position.length();const sc=THREE.MathUtils.clamp((cd-1)/2.2,.35,1.6);
 markers.forEach((o,i)=>{const delay=started?THREE.MathUtils.clamp(introT*3-1.6-i*.004,0,1):0;
  o.vis+=(o.target*delay-o.vis)*Math.min(1,dt*6);const hi=(o===hovered||o===selected)?1:0;
  o.pillar.material.uniforms.uHi.value+=(hi-o.pillar.material.uniforms.uHi.value)*.2;o.ring.material.uniforms.uHi.value=o.pillar.material.uniforms.uHi.value;
  const s=Math.max(o.vis,.0001);o.group.scale.set(s*sc,s*sc,s*(.6+.4*sc));o.group.visible=o.vis>.01;
  o.head.scale.setScalar(.0042*(1+hi*.8));});
 arcs.forEach(a=>{const tg=showArcs&&visible(a.A)&&visible(a.B)&&introT>=1?1:0;a.op+=(tg-a.op)*Math.min(1,dt*3);a.m.uniforms.uOp.value=a.op;a.mesh.visible=a.op>.01;});
 controls.update();
 hovered=started&&!fly?pick():null;renderer.domElement.style.cursor=hovered?'pointer':'grab';
 if(hovered){label.style.opacity=1;label.style.left=mx+'px';label.style.top=my+'px';label.innerHTML=`<b style="color:#${hovered.color.getHexString()}">●</b> ${hovered.cn} <span style="opacity:.55">· ${hovered.city}</span>`;}else label.style.opacity=0;
 updateCards();composer.render();requestAnimationFrame(tick);}
