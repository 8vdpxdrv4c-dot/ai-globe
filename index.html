<style>
@font-face{font-family:"Noto Sans SC";font-weight:400;font-display:swap;src:url(fonts/NotoSansSC-400.woff2) format("woff2")}@font-face{font-family:"Noto Sans SC";font-weight:500;font-display:swap;src:url(fonts/NotoSansSC-500.woff2) format("woff2")}@font-face{font-family:"Noto Sans SC";font-weight:700;font-display:swap;src:url(fonts/NotoSansSC-700.woff2) format("woff2")}@font-face{font-family:"Noto Serif SC";font-weight:600 900;font-display:swap;src:url(fonts/NotoSerifSC-700.woff2) format("woff2")}
:root{--paper:#F5F2EB;--sky:#E3EBF1;--ink:#14233A;--ink2:#4A5568;--ink3:#8A94A3;--rule:rgba(20,35,58,.12);--surface:rgba(255,255,255,.94);
--up:#B8860B;--mid:#0F8C86;--down:#C2602F;--sh:0 1px 2px rgba(20,35,58,.06),0 8px 24px rgba(20,35,58,.08);--ease:cubic-bezier(.2,.8,.2,1);
--serif:"Noto Serif SC","Songti SC","STSong",serif;--sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;--m:28px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;
 background:radial-gradient(120% 90% at 50% 45%,#FBFAF6 0%,var(--paper) 45%,var(--sky) 100%)}
canvas{display:block;position:fixed;inset:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:14px;box-shadow:var(--sh);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.fade{opacity:0;transform:translateY(8px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
.show .fade{opacity:1;transform:none}
/* title */
#title{position:fixed;left:var(--m);top:24px;z-index:3;pointer-events:none;max-width:420px}
#title .k{font-size:11.5px;letter-spacing:.16em;color:var(--ink3);text-transform:uppercase;font-weight:500}
#title h1{font-family:var(--serif);font-weight:700;font-size:40px;line-height:1.18;letter-spacing:.02em;margin:6px 0 6px}

#title p{font-size:15px;color:var(--ink2);line-height:1.6}
#title .nums{display:flex;gap:22px;margin-top:12px;padding-top:12px;border-top:1px solid var(--rule)}
#title .nums div{font-size:12.5px;color:var(--ink3)}#title .nums b{display:block;font-family:var(--serif);font-size:26px;color:var(--ink);font-variant-numeric:tabular-nums;font-weight:700}

#flyBtns{position:fixed;right:var(--m);top:24px;z-index:3;display:flex;padding:3px;gap:2px;border-radius:10px;max-width:calc(100vw - 480px);overflow-x:auto;scrollbar-width:none}
#flyBtns::-webkit-scrollbar{display:none}

#flyBtns button:hover{color:var(--ink);background:rgba(20,35,58,.05)}
#flyBtns button.on{background:var(--ink);color:#fff}
/* legend + dock */
#dock{position:fixed;left:var(--m);bottom:24px;z-index:3;display:flex;gap:8px;align-items:center}
#layerBtns{display:flex;padding:4px;gap:2px;border-radius:10px}
#layerBtns button{display:flex;align-items:center;gap:7px;font-size:14px;padding:6px 11px;border-radius:7px;color:var(--ink2);transition:all .24s var(--ease)}
#layerBtns button i{width:8px;height:8px;border-radius:50%}
#layerBtns button small{font-size:12.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
#layerBtns button:hover{background:rgba(20,35,58,.05)}
#layerBtns button.on{background:rgba(20,35,58,.07);color:var(--ink);font-weight:500}
#layerBtns.dim button:not(.on){opacity:.45}
#filterBtn{display:flex;align-items:center;gap:7px;font-size:14px;padding:10px 14px;border-radius:10px;color:var(--ink)}
#filterBtn svg{width:14px;height:14px}
#filterBtn .badge{min-width:16px;height:16px;border-radius:8px;background:var(--ink);color:#fff;font-size:10px;display:none;align-items:center;justify-content:center;padding:0 4px}
#pop{position:fixed;left:var(--m);bottom:78px;z-index:6;width:380px;max-height:calc(100vh - 200px);overflow-y:auto;padding:16px 16px 12px;opacity:0;transform:translateY(8px) scale(.98);pointer-events:none;transition:all .24s var(--ease)}
#pop.open{opacity:1;transform:none;pointer-events:auto}
#pop h4{font-size:11.5px;letter-spacing:.14em;color:var(--ink3);font-weight:500;margin:14px 0 8px;display:flex;justify-content:space-between;text-transform:uppercase}
#pop h4:first-child{margin-top:0}#pop h4 span{cursor:pointer;color:var(--mid);letter-spacing:0;text-transform:none}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:13px;padding:4px 9px;border-radius:6px;border:1px solid var(--rule);color:var(--ink2);background:#fff;transition:all .2s var(--ease)}
.chip i{width:6px;height:6px;border-radius:50%}
.chip:hover{border-color:rgba(20,35,58,.3)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.sw{display:flex;align-items:center;justify-content:space-between;font-size:14px;color:var(--ink2);padding:6px 0}
.sw button{width:32px;height:18px;border-radius:9px;background:#d5d9df;position:relative;transition:background .2s}
.sw button::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .2s var(--ease)}
.sw button.on{background:var(--ink)}.sw button.on::after{transform:translateX(14px)}
#pop .src{font-size:10.5px;color:var(--ink3);line-height:1.6;margin-top:12px;padding-top:10px;border-top:1px solid var(--rule)}
/* stepper */
#story{position:fixed;right:var(--m);bottom:24px;z-index:3;width:360px;padding:16px 18px 14px}
#story .st{font-size:11.5px;letter-spacing:.14em;color:var(--ink3);text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
#story h2{font-family:var(--serif);font-size:21px;font-weight:700;margin:8px 0 6px;display:flex;align-items:center;gap:8px}
#story h2 i{width:3px;height:16px;border-radius:2px}
#story p{font-size:14px;line-height:1.7;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
#story .nav{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
#story .dots{display:flex;gap:5px}#story .dots i{width:6px;height:6px;border-radius:3px;background:#d5d9df;transition:all .24s var(--ease);cursor:pointer}#story .dots i.on{width:18px;background:var(--ink)}
#story .arrows{display:flex;gap:6px}#story .arrows button{width:28px;height:28px;border-radius:8px;border:1px solid var(--rule);display:flex;align-items:center;justify-content:center;color:var(--ink)}
#story .arrows button:hover{background:rgba(20,35,58,.05)}
#story .min{cursor:pointer;color:var(--ink3);letter-spacing:0}
#story.mini p,#story.mini .nav{display:none}
/* drawer */
#info{position:fixed;right:var(--m);top:76px;bottom:24px;width:360px;z-index:5;padding:22px;overflow-y:auto;transform:translateX(calc(100% + 40px));transition:transform .45s var(--ease)}
#info.open{transform:none}
#info .x{position:absolute;right:14px;top:12px;width:28px;height:28px;border-radius:8px;font-size:18px;color:var(--ink3);display:flex;align-items:center;justify-content:center}
#info .x:hover{background:rgba(20,35,58,.05)}
#info .tags{display:flex;gap:6px;flex-wrap:wrap}
#info .tag{font-size:12.5px;padding:3px 8px;border-radius:5px;border:1px solid}
#info h3{font-family:var(--serif);font-size:28px;font-weight:700;margin:14px 0 2px}
#info .en{font-size:13px;letter-spacing:.08em;color:var(--ink3);text-transform:uppercase}
#info table{width:100%;border-collapse:collapse;margin-top:16px;font-size:14px}
#info td{padding:8px 0;border-top:1px solid var(--rule);vertical-align:top}#info td:first-child{color:var(--ink3);width:72px}
#info .desc{font-size:15px;line-height:1.75;color:var(--ink2);margin-top:14px}
#info .rel{margin-top:16px}#info .rel h5{font-size:10px;letter-spacing:.14em;color:var(--ink3);font-weight:500;margin-bottom:8px}
/* hover label */
#label{position:fixed;z-index:7;pointer-events:none;padding:6px 10px;font-size:14px;border-radius:6px;background:var(--ink);color:#fff;white-space:nowrap;transform:translate(-50%,-150%);opacity:0;transition:opacity .15s}
/* map overlay */
#plbl,#lbl{position:fixed;inset:0;pointer-events:none;z-index:1}
#lbl svg{position:absolute;inset:0;width:100%;height:100%}
.pl{position:absolute;left:0;top:0;text-align:center;color:#56606F;line-height:1.05;white-space:nowrap;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 6px #fff;will-change:transform,opacity}
.pl .z{font-size:13.5px;font-weight:500}.pl .e{font-size:10px;letter-spacing:.06em;opacity:.8;text-transform:uppercase}
.pl.t0 .z{font-family:var(--serif);font-size:17px;letter-spacing:.3em;color:#3d4656;font-weight:600}.pl.t0 .e{font-size:10.5px;letter-spacing:.2em}
.pl.t1 .z{font-size:14px;letter-spacing:.15em;color:#6a7484}
.pl.t2 .z{font-size:13px;color:#2e3846}.pl.t2::before{content:"";display:block;margin:0 auto 2px;width:4px;height:4px;border-radius:50%;background:#5a6576;box-shadow:0 0 0 1.5px #fff}
.cl{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;background:#fff;border:1px solid var(--rule);border-top:3px solid;border-radius:9px;padding:9px 13px 10px;min-width:110px;max-width:280px;box-shadow:0 1px 2px rgba(20,35,58,.06),0 6px 16px rgba(20,35,58,.08);will-change:transform,opacity;transition:box-shadow .2s}
.cl:hover{box-shadow:0 2px 4px rgba(20,35,58,.08),0 12px 28px rgba(20,35,58,.14);z-index:5}
.cl .h{font-size:17.5px;font-weight:700;color:var(--ink);white-space:nowrap}.cl .h small{font-weight:400;font-size:13px;color:var(--ink3);margin-left:4px}
.cl .e{font-size:12px;letter-spacing:.08em;color:var(--ink3);text-transform:uppercase;white-space:nowrap;margin-top:1px}
.cl ul{list-style:none;margin-top:6px;padding-top:6px;border-top:1px solid var(--rule)}
.cl li{font-size:15px;color:var(--ink2);line-height:1.5;white-space:nowrap;display:flex;align-items:center;gap:6px}.cl li i{width:8px;height:8px;border-radius:50%;flex:none}
.cl li:hover{color:var(--ink)}.cl li.more{color:var(--ink3);font-size:13px}.cl.cmp{padding:5px 10px 6px}.cl.cmp .h{font-size:15.5px}.cl.cmp ul,.cl.cmp .ds,.cl.cmp .e,.cl.cmp .sg,.cl.cmp .bar{display:none}
.cl .sg{display:inline-block;font-size:12.5px;padding:1px 6px;border-radius:4px;margin-top:5px;color:#fff}
.cl.rg{border-top-width:3px;min-width:150px}.cl.rg .h{font-family:var(--serif);font-size:19px}
.cl.rg .bar{display:flex;height:4px;border-radius:2px;overflow:hidden;margin-top:6px;gap:1px}
#loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:var(--paper);z-index:20;transition:opacity 1s;font-family:var(--serif);color:var(--ink);font-size:15px;letter-spacing:.2em}
#loader i{width:120px;height:1px;background:var(--rule);position:relative;overflow:hidden}#loader i::after{content:"";position:absolute;inset:0;width:40%;background:var(--ink);animation:ld 1.2s var(--ease) infinite}
@keyframes ld{from{transform:translateX(-100%)}to{transform:translateX(250%)}}

 #flyBtns{top:auto;bottom:66px;left:14px;right:14px;max-width:none}

 #filterBtn span:not(.badge){display:none}

 .cl{max-width:200px;padding:6px 9px 7px}.cl .h{font-size:15px}.cl .e{font-size:10.5px}.cl li{font-size:13px}.cl.rg .h{font-size:16px}.pl .z{font-size:12px}#title h1{font-size:26px}#flyBtns button,#layerBtns button{font-size:13px}
}
